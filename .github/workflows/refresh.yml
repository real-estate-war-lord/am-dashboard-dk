name: refresh-data
on:
  push:
    branches: [main]                 # UI/code change → rebuild + deploy (no data fetch)
  schedule: [{ cron: "0 6 3 * *" }]  # 3rd of each month, 06:00 UTC → fetch + build + commit + deploy
  workflow_dispatch:                 # manual: same as schedule
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # exposed as an env var so the step below can test for it — the `secrets` context is not
    # available in a step-level `if`, and an unset secret must skip the call, never send an empty key
    env:
      UDDSTAT_API_KEY: ${{ secrets.UDDSTAT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scripts/fetch_statbank.py
      # School quality (STIL) only when a key is configured. Without one the committed
      # data/processed/schools.json is left exactly as it is and the layer keeps working.
      - name: Refresh school quality (skipped when UDDSTAT_API_KEY is unset)
        if: ${{ env.UDDSTAT_API_KEY != '' }}
        run: python scripts/fetch_uddstat.py --schools && python scripts/build_schools.py
      # Population outlook: DST's municipal projection, Københavns Kommune's district projection,
      # and the measured net dwelling additions. Each is a fresh pull; the backtest depends on KK
      # continuing to serve superseded vintages, so it is allowed to fail without failing the run.
      # scripts/build_housing_gap.py is deliberately absent — it needs a fitted household-size
      # trend, which the hard-data rule forbids in the UI (docs/FORECAST.md §0, §7).
      - name: Refresh the population outlook
        run: |
          python scripts/build_forecast.py
          python scripts/build_net_dwellings.py
          python scripts/build_cph_forecast.py
          python scripts/build_cph_backtest.py || echo "backtest skipped (superseded KK vintages unavailable)"
      # Climate: the two keyless, quick sources only. DMI Klimaatlas is ~7 s for 8 748 rows and
      # Forsikring & Pension is two small CSVs, so both ride along with the monthly refresh.
      #
      # The surge zones and the flood risk areas are deliberately NOT here. They are 208 MB and
      # ~90 MB from gisportal.mst.dk, which answers HTTP 500 on a multi-feature page and has to be
      # paged one OBJECTID at a time with backoff; and they change when an authority republishes a
      # designation — an event that deserves a human decision and a changelog line, not a cron job.
      # Rebuild them by hand (docs/CLIMATE.md §8):
      #   python scripts/fetch_kyst_surge.py     && python scripts/build_kyst_zones.py
      #   python scripts/fetch_flood_official.py --areas
      # The committed data/processed/climate/ is left exactly as it is until then, and the layer
      # keeps working on it.
      - name: Refresh the climate figures (Klimaatlas + Forsikring & Pension)
        run: |
          python scripts/fetch_klimaatlas.py
          python scripts/fetch_fp_claims.py
          python scripts/build_climate.py
      - run: python scripts/build_makro.py && python scripts/build_market.py && (python scripts/build_cph.py || true)
      - name: Validate the outlook layer
        run: python scripts/validate_forecast.py
      - name: Commit processed data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/processed data/raw/*.meta.json
          git commit -m "data: monthly refresh $(date +%F)" || echo "nothing to commit"
          git push
  build-deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scripts/build_dashboard.py
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
