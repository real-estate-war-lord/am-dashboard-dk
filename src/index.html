<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro Dashboard · Denmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>{{LEAFLET_CSS}}</style>
<style>{{APP_CSS}}</style>
</head>
<body>
<div class="app">
  <!-- ≤1024 px the sidebar is a 52 px bar with a drawer behind ☰ (spec §4.1); ≥1025 px the bar is
       hidden, .drawer is display:contents and <aside> is the grid's first column, as before. -->
  <div class="mtop" data-testid="topbar-mobile">
    <button class="navtog" id="navtog" data-nav-toggle data-testid="nav-toggle"
            aria-expanded="false" aria-controls="navdrawer" aria-label="Open the navigation">☰</button>
    <span class="mbrand">Macro Dashboard</span>
    <span class="mview" id="mview"></span>
  </div>
  <div class="drawer" id="navdrawer" data-testid="nav-drawer" role="dialog" aria-modal="true" aria-label="Navigation">
    <button class="scrim" data-nav-close tabindex="-1" aria-label="Close the navigation"></button>
    <aside data-testid="sidebar">
      <div class="brand"><h2>Macro Dashboard</h2></div>
      <div id="nav"></div>
      <div class="side-foot" id="xfoot"></div>
    </aside>
  </div>
  <main id="main">
    <div class="topbar"><div id="hd"></div></div>
    <div id="body"></div>
  </main>
</div>
<script>{{LEAFLET_JS}}</script>
<script>window.DATA = {{DATA}};</script>
<script>{{TESTPROP_JS}}</script>
<script>{{CLIMATE_JS}}</script>
<script>{{ROUTE_JS}}</script>
<script>{{PICKER_JS}}</script>
<script>{{EXPORT_JS}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
